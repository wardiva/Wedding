<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1008, height=1792" />
    <title>Curtain Reveal</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #1d1712; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #couple, #curtain { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <!-- The site's opening: the bow unties and the drapes part over the couple
         walking down the aisle. The curtain layer is the restored opening with
         the parting baked into its alpha (../build_reveal.py); the couple clip
         starts 1 s in, just before the drapes begin to part, so the site's hero
         video carries on from 3.7 s at the hand-off. 9:16 like the hero, so the
         framing doesn't change when it takes over. -->
    <div id="root" data-composition-id="reveal" data-start="0"
         data-width="1008" data-height="1792" data-duration="4.7" data-fps="30">
      <video id="couple" class="clip" src="../assets/couple_src.mp4" muted playsinline
             data-start="1" data-duration="3.7" data-track-index="0"></video>
      <video id="curtain" class="clip" src="../assets/curtain_alpha.webm" muted playsinline
             data-start="0" data-duration="4.7" data-track-index="1"></video>
    </div>
    <script>
      window.__timelines["reveal"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
