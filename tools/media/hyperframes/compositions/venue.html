<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1008, height=1600" />
    <title>Venue Walk</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #1d1712; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #walk {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; object-position: 50% 100%;
      }
    </style>
  </head>
  <body>
    <!-- The couple walking down the aisle, petals and recorded UI removed.
         Played once by the site when the venue section is reached. -->
    <div id="root" data-composition-id="venue" data-start="0"
         data-width="1008" data-height="1600" data-duration="5.4" data-fps="30">
      <video id="walk" class="clip" src="../assets/venue_src.mp4" muted playsinline
             data-start="0" data-duration="5.4" data-track-index="0"></video>
    </div>
    <script>
      window.__timelines["venue"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
